# Cycle-7 — Northwind Ops multi-service overlay (`v1.4.0` tip)
#
# Usage (from repo root):
#   docker compose -f infra/docker-compose.prod.yml -f infra/docker-compose.cycle7.yml up -d --build
#
# Publishes: FTP :21 (+ PASV 30000-30009), real SSH :2222, Cowrie decoy :2223.
# Jump host stays on internal Docker network only (no host publish).
# Do NOT merge into default prod compose — SoftDev / lab only (ADR-035).
#
# @see docs/security/Cycle-7/Dev/cycle-7-decisions.md

networks:
  cycle7_internal:
    name: kc_cycle7_internal
    internal: true

services:
  cycle7-ftp:
    build:
      context: ./cycle7/ftp
    ports:
      - '21:21'
      - '30000-30009:30000-30009'
    environment:
      # Local examiner default. On Host-Only / LAN, set to the box IP Kali uses.
      PASV_ADDRESS: ${CYCLE7_FTP_PASV_ADDRESS:-127.0.0.1}
    mem_limit: 64m
    restart: unless-stopped

  cycle7-bastion:
    build:
      context: ./cycle7/bastion
    ports:
      - '2222:22'
    networks:
      - default
      - cycle7_internal
    mem_limit: 64m
    restart: unless-stopped

  # Decoy only — not graded (timebox players off this listener).
  # Image tags on Docker Hub are sparse; pin digest for reproducibility.
  cycle7-cowrie:
    image: cowrie/cowrie:latest@sha256:42e01e0e5fe705a0a63dacc0f1992b2d230740ac149af7675f48197abf740d44
    ports:
      - '2223:2222'
    mem_limit: 256m
    restart: unless-stopped

  cycle7-jump:
    build:
      context: ./cycle7/jump
    networks:
      - cycle7_internal
    expose:
      - '8080'
    mem_limit: 32m
    restart: unless-stopped
