# M7 / v2.0.0 — TLS compose overlay (required before tag v2.0.0).
#
# Usage (from repo root):
#   ./infra/scripts/gen-lab-certs.sh
#   docker compose -f infra/docker-compose.prod.yml -f infra/docker-compose.tls.yml up -d --build
#   ./infra/tls-smoke.sh
#
# Day-to-day lab may stay on HTTP :8080 (prod compose alone). This overlay:
# - Serves HTTPS on host :8443 with lab certs from infra/certs/
# - Redirects HTTP :8080 → https://<host>:8443 (via nginx-tls.conf)
# - Sets COOKIE_SECURE=true so refresh cookies get Secure + SameSite=Strict
# - Widens CORS for https://127.0.0.1:8443 / https://localhost:8443
#
# Security: CWE-319 cleartext transport remediation for the pre-tag gate.

services:
  backend:
    environment:
      COOKIE_SECURE: 'true'
      CORS_ORIGINS: ${CORS_ORIGINS_TLS:-https://127.0.0.1:8443,https://localhost:8443}

  nginx:
    ports:
      - '8443:443'
    volumes:
      - ./nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
