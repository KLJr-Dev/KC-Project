# Cycle-10 edge — HTTPS tip (v2.10.0 Blue)
# Security headers + HSTS + CSP; weak ciphers removed; server_tokens off.
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 128; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  server_tokens off;

  # TLS 1.2/1.3 only — no legacy DES/3DES/SHA1 suites
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
  ssl_prefer_server_ciphers off;

  resolver 127.0.0.11 valid=10s ipv6=off;

  limit_req_zone $binary_remote_addr zone=access_req:1m rate=10r/m;

  # Cleartext → HTTPS
  server {
    listen 80;
    server_name edge.northwind.lab _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name edge.northwind.lab _;

    ssl_certificate     /etc/nginx/certs/edge.crt;
    ssl_certificate_key /etc/nginx/certs/edge.key;

    # Hardening headers (parity with prod nginx + HSTS for HTTPS tip)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    proxy_hide_header X-Powered-By;

    # Rate-limit public access-request endpoint (must precede /api/)
    location ^~ /api/access-requests {
      limit_req zone=access_req burst=5 nodelay;
      set $api_upstream api:4000;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://$api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Strip /api prefix (Nest routes are /auth, /packets, …)
    location /api/ {
      set $api_upstream api:4000;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://$api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ @portal;
    }

    location @portal {
      set $portal_upstream portal:3000;
      proxy_pass http://$portal_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
