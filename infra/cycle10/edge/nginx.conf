worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 128; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  server_tokens on;

  ssl_protocols TLSv1.2;
  ssl_ciphers 'ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:AES128-SHA:AES256-SHA:DES-CBC3-SHA';
  ssl_prefer_server_ciphers on;

  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 443 ssl;
    server_name edge.northwind.lab _;

    ssl_certificate     /etc/nginx/certs/edge.crt;
    ssl_certificate_key /etc/nginx/certs/edge.key;

    # Strip /api prefix (Nest routes are /auth, /packets, … — same as prod nginx)
    location /api/ {
      set $api_upstream api:4000;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://$api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ @portal;
    }

    location @portal {
      set $portal_upstream portal:3000;
      proxy_pass http://$portal_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
