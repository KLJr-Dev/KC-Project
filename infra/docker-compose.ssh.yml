# Cycle-4 SoftDev — SSH foothold overlay (`v1.2.0`)
#
# Usage (from repo root):
#   docker compose -f infra/docker-compose.prod.yml -f infra/docker-compose.ssh.yml up -d --build
#
# Publishes host :2222 → container :22 for user `lab` / password `labpass`.
# Do NOT merge this into default prod compose — SoftDev / lab only (ADR-033).
services:
  ssh:
    build:
      context: ./ssh
    ports:
      - '2222:22'
    mem_limit: 64m
    restart: unless-stopped
