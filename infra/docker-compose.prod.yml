# v2.10.0 — production / showcase Docker stack (Cycle-10 Blue)
# Dev HTTP :8080 is non-showcase. Lab tip: combine with docker-compose.cycle10-lab.yml (:443).
#
# Secrets: Compose secrets for JWT PEMs; DB passwords via env / *_FILE.
# Generate JWT: ./infra/scripts/gen-jwt-keys.sh
# Generate DB TLS: ./infra/scripts/gen-db-tls.sh

networks:
  edge:
  dbnet:
    internal: true

secrets:
  jwt_private:
    file: ./keys/jwt-private.pem
  jwt_public:
    file: ./keys/jwt-public.pem

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:-kc-change-me-prod}
      POSTGRES_DB: ${DB_NAME:-kc_prod}
      DB_APP_USER: ${DB_USER:-kc_app}
      DB_APP_PASSWORD: ${DB_PASSWORD:-kc-app-change-me}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    mem_limit: 512m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    networks:
      - dbnet
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      intake:
        condition: service_started
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_ADMIN_USER: ${DB_ADMIN_USER:-postgres}
      DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD:-kc-change-me-prod}
      DB_USER: ${DB_USER:-kc_app}
      DB_PASSWORD: ${DB_PASSWORD:-kc-app-change-me}
      DB_NAME: ${DB_NAME:-kc_prod}
      DB_SSL: ${DB_SSL:-false}
      DB_SSL_CA_PATH: /run/secrets/db-ca.crt
      PORT: ${PORT:-4000}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      NODE_ENV: production
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
      ALLOW_PUBLIC_REGISTER: ${ALLOW_PUBLIC_REGISTER:-0}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://127.0.0.1,https://localhost,http://127.0.0.1:8080,http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      REFRESH_COOKIE_PATH: ${REFRESH_COOKIE_PATH:-/api/auth}
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public
      INTAKE_URL: ${INTAKE_URL:-http://intake:8000}
      NEXT_PUBLIC_ENABLE_LAB_UI: 'false'
    secrets:
      - jwt_private
      - jwt_public
    # uploads via tmpfs — avoids Docker Desktop userns sticky volume ownership
    # that blocked root migrate seed writes (EACCES). Lab tip does not need durable uploads.
    expose:
      - '4000'
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /app/uploads:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    # Drop all, then allow only what entrypoint needs to chown uploads + su-exec → node
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - SETUID
      - SETGID
    mem_limit: 512m
    cpus: 1.0
    networks:
      - edge
      - dbnet
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "node -e \"require('http').get('http://127.0.0.1:4000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_ENABLE_LAB_UI: ${NEXT_PUBLIC_ENABLE_LAB_UI:-false}
    depends_on:
      - backend
    expose:
      - '3000'
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 0.5
    networks:
      - edge
    # Next standalone may lack curl/wget — rely on depends_on; optional probe later

  intake:
    build:
      context: ../intake
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_ADMIN_USER: ${DB_ADMIN_USER:-postgres}
      DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD:-kc-change-me-prod}
      INTAKE_DB_NAME: ${INTAKE_DB_NAME:-kc_intake}
      INTAKE_DB_USER: ${INTAKE_DB_USER:-kc_intake_app}
      INTAKE_DB_PASSWORD: ${INTAKE_DB_PASSWORD:-kc-intake-app-change-me}
      PORT: 8000
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public
      DB_SSL: ${DB_SSL:-false}
    secrets:
      - jwt_public
    expose:
      - '8000'
    read_only: true
    tmpfs:
      - /tmp:size=32m
    security_opt:
      - no-new-privileges:true
    # Drop all, then allow only what entrypoint needs to gosu → intake
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - SETUID
      - SETGID
    mem_limit: 256m
    cpus: 0.5
    networks:
      - edge
      - dbnet

  nginx:
    image: nginx:alpine
    ports:
      - '8080:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
      - intake
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=8m
      - /tmp:size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    mem_limit: 128m
    cpus: 0.25
    networks:
      - edge

volumes:
  pgdata_prod:
