# v2.0.0 — production Docker stack (secure parallel)
# Usage: cp infra/.env.example infra/.env && docker compose -f infra/docker-compose.prod.yml up -d --build
# Postgres is NOT published on the host (F-05). For Jest e2e from the host, also pass docker-compose.e2e.yml.
services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kc-change-me-prod}
      POSTGRES_DB: ${DB_NAME:-kc_prod}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-kc-change-me-prod}
      DB_NAME: ${DB_NAME:-kc_prod}
      PORT: ${PORT:-4000}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      NODE_ENV: production
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
    volumes:
      - uploads:/app/uploads
    expose:
      - '4000'

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_ENABLE_LAB_UI: ${NEXT_PUBLIC_ENABLE_LAB_UI:-false}
    depends_on:
      - backend
    expose:
      - '3000'

  nginx:
    image: nginx:alpine
    ports:
      - '8080:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  pgdata_prod:
  uploads:
