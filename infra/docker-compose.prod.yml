# v2.6.0 — production Docker stack (Cycle-9 Blue)
# Usage: cp infra/.env.example infra/.env && docker compose -f infra/docker-compose.prod.yml up -d --build
# Postgres is NOT published on the host. DB lives on internal network.
#
# Wave B: kc_intake_app least-priv, non-root intake, internal dbnet, CPU limits.

networks:
  edge:
  dbnet:
    internal: true

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:-kc-change-me-prod}
      POSTGRES_DB: ${DB_NAME:-kc_prod}
      DB_APP_USER: ${DB_USER:-kc_app}
      DB_APP_PASSWORD: ${DB_PASSWORD:-kc-app-change-me}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    mem_limit: 512m
    cpus: 1.0
    networks:
      - dbnet
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      intake:
        condition: service_started
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_ADMIN_USER: ${DB_ADMIN_USER:-postgres}
      DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD:-kc-change-me-prod}
      DB_USER: ${DB_USER:-kc_app}
      DB_PASSWORD: ${DB_PASSWORD:-kc-app-change-me}
      DB_NAME: ${DB_NAME:-kc_prod}
      PORT: ${PORT:-4000}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      NODE_ENV: production
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      REFRESH_COOKIE_PATH: ${REFRESH_COOKIE_PATH:-/api/auth}
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt-public.pem
      INTAKE_URL: ${INTAKE_URL:-http://intake:8000}
    volumes:
      - uploads:/app/uploads
      - ../infra/keys/jwt-private.pem:/run/secrets/jwt-private.pem:ro
      - ../infra/keys/jwt-public.pem:/run/secrets/jwt-public.pem:ro
    expose:
      - '4000'
    mem_limit: 512m
    cpus: 1.0
    networks:
      - edge
      - dbnet

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_ENABLE_LAB_UI: ${NEXT_PUBLIC_ENABLE_LAB_UI:-false}
    depends_on:
      - backend
    expose:
      - '3000'
    mem_limit: 256m
    cpus: 0.5
    networks:
      - edge

  intake:
    build:
      context: ../intake
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_ADMIN_USER: ${DB_ADMIN_USER:-postgres}
      DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD:-kc-change-me-prod}
      INTAKE_DB_NAME: ${INTAKE_DB_NAME:-kc_intake}
      INTAKE_DB_USER: ${INTAKE_DB_USER:-kc_intake_app}
      INTAKE_DB_PASSWORD: ${INTAKE_DB_PASSWORD:-kc-intake-app-change-me}
      PORT: 8000
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt-public.pem
    volumes:
      - ../infra/keys/jwt-public.pem:/run/secrets/jwt-public.pem:ro
    expose:
      - '8000'
    mem_limit: 256m
    cpus: 0.5
    networks:
      - edge
      - dbnet

  nginx:
    image: nginx:alpine
    ports:
      - '8080:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
      - intake
    mem_limit: 128m
    cpus: 0.25
    networks:
      - edge

volumes:
  pgdata_prod:
  uploads:
