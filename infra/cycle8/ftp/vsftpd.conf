listen=YES
listen_ipv6=NO
anonymous_enable=YES
local_enable=YES
write_enable=YES
anon_root=/var/ftp
anon_world_readable_only=YES
no_anon_password=YES
anon_other_write_enable=NO
chroot_local_user=YES
allow_writeable_chroot=YES
pasv_enable=YES
pasv_min_port=30000
pasv_max_port=30009
pasv_promiscuous=NO
seccomp_sandbox=NO
xferlog_enable=YES
log_ftp_protocol=YES
ftpd_banner=Northwind Ops FTP (lab)
local_umask=022
# CYCLE8: local users only (lisa) — anon cannot read F2
userlist_enable=NO
