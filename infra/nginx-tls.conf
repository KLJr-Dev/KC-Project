#
# M7 / v2.0.0 — TLS termination (lab / pre-tag gate).
#
# Security measures:
# - CWE-319: HTTPS on :443 (host :8443) so passwords, JWTs, and cookies are
#   not cleartext on the wire (pairs with COOKIE_SECURE=true from TLS compose).
# - CWE-523: HTTP :80 redirects to HTTPS (host :8080 → :8443 in this lab).
# - CWE-523 / HSTS: Strict-Transport-Security on HTTPS responses so browsers
#   prefer HTTPS after first visit (lab max-age; production may raise).
# - Same baseline headers as nginx.conf (nosniff, frame deny, CSP, referrer).
#
# Certs: mounted from infra/certs/ (generated by scripts/gen-lab-certs.sh).
# Day-to-day HTTP profile remains infra/nginx.conf on docker-compose.prod.yml alone.
#

# ── HTTP → HTTPS redirect (published as host :8080 → container :80) ─────────
server {
    listen 80 default_server;
    server_name _;

    # Lab publishes HTTPS on host port 8443; include it in the redirect target.
    return 301 https://$host:8443$request_uri;
}

# ── HTTPS (published as host :8443 → container :443) ────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name localhost 127.0.0.1;

    ssl_certificate     /etc/nginx/certs/localhost.pem;
    ssl_certificate_key /etc/nginx/certs/localhost-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 5m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'" always;
    add_header X-XSS-Protection "0" always;

    location ^~ /api/docs {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header X-Powered-By;
    }

    location /api/ {
        proxy_pass http://backend:4000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header X-Powered-By;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header X-Powered-By;
    }
}
