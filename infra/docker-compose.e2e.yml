# Overlay: publish Postgres to host :5433 for local e2e only (not default prod).
# Usage:
#   docker compose -f infra/docker-compose.prod.yml -f infra/docker-compose.e2e.yml up -d postgres
#
# Cycle-9 Wave B: prod `dbnet` is internal:true (no port publish). Attach postgres
# to `edge` as well so host :5433 works for Jest e2e.
services:
  postgres:
    ports:
      - '5433:5432'
    networks:
      - dbnet
      - edge
