# Cycle-8 — Northwind Intake multi-service overlay (`v1.5.0` tip)
#
# Usage (from repo root):
#   docker compose -f infra/docker-compose.prod.yml -f infra/docker-compose.cycle8.yml up -d --build
#
# CYCLE8: Graded path uses Intake SQLi + (later) FTP/Cowrie/edge/Samba/SMTP.
# Do NOT merge overlay publishes into default prod compose (ADR-036).
#
# @see docs/security/Cycle-8/Dev/cycle-8-decisions.md

networks:
  cycle8_internal:
    name: kc_cycle8_internal
    internal: true

services:
  # Python Intake microservice — internal only; nginx /api/intake/ (nginx-cycle8.conf)
  cycle8-intake:
    build:
      context: ../intake
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_ADMIN_USER: ${DB_ADMIN_USER:-postgres}
      DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD:-kc-change-me-prod}
      INTAKE_DB_NAME: kc_intake
      PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - '8000'
    mem_limit: 256m
    restart: unless-stopped

  nginx:
    volumes:
      - ./nginx-cycle8.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
      - cycle8-intake
